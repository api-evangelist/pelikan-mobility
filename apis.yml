name: Pelikan Mobility
description: >-
  Pelikan Mobility is a Paris-based smart-leasing and fleet-management company for electric
  commercial vehicles, founded in late 2022 by David Salfati and Vincent Schachter. It operates
  two products: Pelikan Lease, a very-long-term leasing offer (up to 10 years / 300,000 km) for
  electric utility vans that targets a 20% lower total cost of ownership, and Pelikan FleetPilot,
  a SaaS platform using digital twins, optimization algorithms and generative AI to plan fleet
  renewal, electrification and vehicle redeployment across large B2B fleets in utilities,
  maintenance, construction and logistics. The company is backed by Seedcamp, Frst and PaleBlueDot
  Ventures. It publishes a marketing and resources website but exposes no public API or developer
  surface at this time; this profile records its identity and web-domain security posture.
